services:
  mtls-resource:
    build: ./mtls-resource
    environment:
      SERVER_PORT: 8444
      MTLS_SERVER_KEY_STORE: file:/certs/mtls-resource.p12
      MTLS_TRUST_STORE: file:/certs/truststore.p12
      CERT_STORE_PASSWORD: changeit
    volumes:
      - ./certs:/certs:ro
    ports:
      - "8444:8444"

  backend:
    build: ./backend
    environment:
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: Lax
      DEMO_USERNAME: student
      DEMO_PASSWORD: change-me-local
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MTLS_RESOURCE_URL: https://mtls-resource:8444
      MTLS_CLIENT_KEY_STORE: /certs/backend-client.p12
      MTLS_TRUST_STORE: /certs/truststore.p12
      CERT_STORE_PASSWORD: changeit
    volumes:
      - ./certs:/certs:ro
    ports:
      - "8080:8080"
    depends_on:
      - mtls-resource

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend
